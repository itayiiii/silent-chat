# Builds the Android app (APK) automatically on every change to main,
# and puts it on a fixed download link:
# https://github.com/itayiiii/silent-chat/releases/download/test-build/silent-chat.apk
# Free: GitHub Actions costs nothing for public repositories.
name: Android APK

on:
  push:
    branches: [main]
    # only when the app itself changes (not for README edits etc.), so testers
    # don't get a new build - which needs a reinstall - for nothing
    paths:
      - index.html
      - ai-worker.js
      - icons/**
      - lib/**
      - mobile/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the web part (scrambled) and copy it into the Android project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          { npm ci && npm run build:android; } 2>&1 | tee "$GITHUB_WORKSPACE/logs/web.log"

      # A release build (not debuggable), signed with the fixed test key in mobile/android/app,
      # so every new version installs over the old one.
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/logs/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/silent-chat.apk"

      # Build logs are not readable from outside, so on failure the important lines
      # are shown as error notes on the run page.
      - name: Show the build errors
        if: failure()
        working-directory: .
        run: |
          enc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
          for f in logs/web.log logs/gradle.log; do
            [ -s "$f" ] || continue
            echo "::error title=$(basename "$f") - error lines::$(grep -i -E 'error|failed|exception|went wrong' "$f" | head -n 40 | enc)"
            echo "::error title=$(basename "$f") - last lines::$(tail -n 60 "$f" | enc)"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: silent-chat-apk
          path: silent-chat.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish on the fixed download link
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build silent-chat.apk --prerelease --target "$GITHUB_SHA" \
            --title "גרסת ניסיון ${VERSION_NAME}" \
            --notes "קובץ התקנה לאנדרואיד (APK) לבודקים. נבנה אוטומטית מהקוד האחרון בענף main. מגרסה 0.1.5 — מתקינים מעל הגרסה הקודמת, בלי להסיר."
