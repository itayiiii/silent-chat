<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2341"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="mark">
    <!-- the "quiet bubble" -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="8"/>
    <circle cx="256" cy="256" r="164" fill="url(#orb)"/>
    <!-- headphones -->
    <g transform="translate(0 -14)">
      <path d="M178 300 V268 a78 78 0 0 1 156 0 V300" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
      <rect x="156" y="270" width="54" height="92" rx="24" fill="#fff"/>
      <rect x="302" y="270" width="54" height="92" rx="24" fill="#fff"/>
      <!-- voice between the ears -->
      <rect x="228" y="303" width="12" height="30" rx="6" fill="#0a0e1a" fill-opacity="0.55"/>
      <rect x="250" y="291" width="12" height="54" rx="6" fill="#0a0e1a" fill-opacity="0.55"/>
      <rect x="272" y="303" width="12" height="30" rx="6" fill="#0a0e1a" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
